# Worker 프로파일 — 운영자 macOS에서 활성화
# 사용: java -jar netis-maker.jar --spring.profiles.active=worker

spring:
  # 워커는 자체 DB 풀 불필요 (백엔드에 HTTP 폴링만)
  # 백엔드 application.yml의 datasource를 무력화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  # 워커는 HTTP 서버를 띄우지 않음 (단방향 폴링 클라이언트)
  main:
    web-application-type: none
  # @Scheduled 스레드 풀. 기본 1이라 heartbeat(10s)과 pollAndProcess(5s, 블로킹 N분)가
  # 같은 thread를 공유 → task 처리 중 heartbeat 못 보내서 UI에서 DOWN 오인.
  # 4로 늘려 heartbeat/poll/stale-recovery 등이 독립 스레드에서 동작.
  task:
    scheduling:
      pool:
        size: 4

netis-maker:
  worker:
    id: ${WORKER_ID:mac-worker-1}
    version: ${WORKER_VERSION:0.1.0}
    # 사내 백엔드 외부 공개 워커 엔드포인트 (DESIGN §6 외부 공개 모델)
    api-base-url: ${API_BASE_URL:https://worker.netis-maker.internal}
    api-key: ${WORKER_API_KEY:dev-only-change-me}
    poll-interval-seconds: 5
    heartbeat-interval-seconds: 10
    # 결과 보고 재시도 — 일시적 백엔드 장애(풀 고갈 등)에도 성공/실패 보고가 닿도록.
    result-report-max-retries: 5
    result-report-backoff-ms: 2000
    repos-dir: ${REPOS_DIR:${user.home}/netis-maker/repos}
    dead-letter-dir: ${DEAD_LETTER_DIR:${user.home}/netis-maker/dead-letter}
    claude-cli-path: ${CLAUDE_CLI:/opt/homebrew/bin/claude}
    github-pat: ${GITHUB_PAT:}
    # 구현 단계 — 분석완료 + admin 승인 후 worktree에서 코드 작성 + PR 생성
    worktree-root: ${WORKTREE_ROOT:${user.home}/netis-maker/worktrees}
    branch-prefix: ${BRANCH_PREFIX:netismaker/}
    git-user-name: ${GIT_USER_NAME:netisMaker}
    git-user-email: ${GIT_USER_EMAIL:netismaker@hamonsoft.local}
    # 구현은 분석보다 훨씬 오래 걸림 — 큰 코드베이스의 다수 subtask 처리 가정
    implementation-timeout: ${IMPLEMENTATION_TIMEOUT:45m}
    # DESIGN §11: 한국어 분석 프롬프트 템플릿
    prompt-template: |
      당신은 코드베이스 분석 어시스턴트입니다. 모든 출력은 반드시 한국어로 작성하세요.

      레포: {github_repo}
      브랜치: {github_branch} (현재 커밋: {commit_sha})
      요청자 작업 제목: {title}
      요청 상세:
      {description}

      아래 형식의 마크다운 보고서를 정확히 이 섹션 구조로 출력하세요.
      섹션 제목과 번호는 변경하지 마세요 (파서가 사용합니다).

      ## 1. 요구사항 요약
      (2~4문장으로 핵심 정리)

      ## 2. 영향 범위
      - 수정 예상 파일: (경로 목록)
      - 추가 예상 파일: (경로 목록)
      - 영향 받는 모듈/패키지

      ## 3. 접근 방법
      (1~3개 문단으로 구현 전략 설명)

      ## 4. Subtask 분해
      각 항목은 다음 형식 (반드시 이 구조 유지):
      - **제목**: ...
        - 대상 파일: `path/to/file`, `path/to/file2`
        - 예상 LoC: 약 N줄
        - 위험도: L | M | H
        - 설명: ...

      ## 5. 위험 요소 및 미해결 질문
      - ...
    # 구현 prompt 템플릿. {branch_name}/{analysis_markdown}/{subtasks_json} 추가 placeholder.
    # 미설정 시 WorkerMainLoop.defaultImplementationPrompt() 사용.
    implementation-prompt-template: |
      당신은 코드 구현 전문가입니다. 현재 디렉토리는 새 git worktree이며
      브랜치 '{branch_name}'가 체크아웃되어 있습니다.
      베이스: {github_branch} @ {commit_sha}

      ## 작업
      {title}

      ## 요구사항
      {description}

      ## 사전 분석 결과 (참고용 — 우선 따르세요)
      {analysis_markdown}

      ## 분석된 subtasks (JSON)
      {subtasks_json}

      ## 지시
      위 분석에서 제시한 우선순위(H → M → L) 순으로 실제 코드를 수정/추가하세요.
      - 현재 디렉토리에서 직접 파일을 편집·생성하세요 (cd 금지)
      - 의미 있는 변경을 누적하세요 (커밋은 워커가 마지막에 한 번에 처리)
      - 빌드/테스트는 가능하면 수행하되 실패 시 명확한 사유를 출력에 남기세요
      - 종료 직전에 `git status` 결과를 출력하세요
    # 디자인 단계 — DesignSync로 디자인 시스템 pull + 목업 생성 + Claude Design 업로드
    design-timeout: ${DESIGN_TIMEOUT:30m}
    design-prompt-template: |
      당신은 UI/UX 디자이너입니다. 현재 디렉토리는 대상 레포의 읽기 전용 체크아웃입니다.
      코드를 수정하지 말고, 아래 작업의 화면 목업(디자인)만 생성하세요. 모든 산출물은 한국어.

      ## 작업
      {title}

      ## 요구사항
      {description}

      ## 사전 분석 결과
      {analysis_markdown}

      ## 분석된 subtasks (JSON)
      {subtasks_json}

      ## 이전 디자인 (반려된 경우에만 존재 — 백지 재생성 금지, 피드백만 반영해 수정)
      {previous_design_markdown}

      ## 반려 피드백 이력 (JSON — 최신 항목이 가장 중요)
      {feedback_history}

      ## 절차 (순서 엄수)
      1. **디자인 시스템 pull**: 디자인 시스템 프로젝트 ID가 '{design_system_project_id}'로 주어졌다면
         (값이 "없음"이 아니면) DesignSync 도구(list_files/get_file)로 해당 프로젝트의 토큰·컴포넌트를
         읽어 스타일 기준으로 삼으세요. **DesignSync 인증 실패 또는 프로젝트 접근 실패 시:
         즉시 중단하고 `.design-out/ERROR.txt`에 실패 사유를 쓴 뒤 종료하세요. 다른 파일을 만들지 마세요.**
         값이 "없음"이면 이 단계를 건너뛰고 범용적으로 깔끔한 스타일을 쓰세요.
      2. **기존 코드 참조**: 현재 디렉토리의 프론트엔드 코드(컴포넌트/스타일)를 훑어 기존 UI 관례를 파악하세요.
      3. **목업 생성**: 작업에 필요한 화면별로 self-contained HTML(인라인 CSS, 외부 요청 없음)을
         `.design-out/screens/` 아래에 만드세요 (예: `.design-out/screens/main.html`).
         각 파일은 실제 데이터 예시를 채운 완성된 화면이어야 합니다. 파일당 200KB 이하.
      4. **디자인 문서**: `.design-out/DESIGN.md`에 디자인 의사결정(레이아웃/색/타이포/컴포넌트 매핑,
         화면별 설명)을 정리하세요.
      5. **Claude Design 업로드 (비치명 — 실패해도 3·4 산출물은 유지)**:
         출력 프로젝트 ID가 '{design_output_project_id}'로 주어졌다면 그 프로젝트에,
         "없음"이면 DesignSync create_project로 "netisMaker — {github_repo} 목업" 프로젝트를 만들어
         `task-{task_id}/` 경로 프리픽스로 목업들을 write_files 업로드하세요.
      6. **결과 메타**: `.design-out/result.json`에 다음 JSON을 쓰세요 (업로드 실패 시 projectId/url은 null):
         {"screens":[{"path":"screens/main.html","title":"메인 화면"}],"designProjectId":"...","designUrl":"..."}
    deploy:
      target: ${DEPLOY_TARGET:local}
      port-range: ${DEPLOY_PORT_RANGE:19000-19099}
      default-container-port: ${DEPLOY_DEFAULT_PORT:8080}
      public-host: ${DEPLOY_PUBLIC_HOST:localhost}
      build-timeout: 10m
      # 컨테이너 기동 후 생존 확인 grace 기간(초). 이 안에 종료되면 배포실패 + 컨테이너 로그 첨부.
      health-check-seconds: ${DEPLOY_HEALTHCHECK_SECONDS:15}
      # HTTP readiness: 기동 후 최대 이 시간(초) 안에 readiness-path가 응답하면 즉시 배포완료.
      # 끝까지 응답 없어도 컨테이너가 살아있으면 liveness 기준으로 완료 처리(비-HTTP 앱 대비).
      readiness-seconds: ${DEPLOY_READINESS_SECONDS:40}
      readiness-path: ${DEPLOY_READINESS_PATH:/}
      # GC 리퍼 (C2): docker 상태 기반 자가정리. label=netis-maker.task / netis-task- 접두사만 대상.
      gc-enabled: ${DEPLOY_GC_ENABLED:true}
      gc-interval-minutes: ${DEPLOY_GC_INTERVAL_MIN:60}
      gc-orphan-grace-minutes: ${DEPLOY_GC_ORPHAN_GRACE_MIN:60}
      gc-keep-images-per-task: ${DEPLOY_GC_KEEP_IMAGES:1}
      # 배포 런타임 정합(reconcile): DB 배포완료 ↔ 실제 컨테이너 생존을 주기 대사.
      # 소실 → 배포중단됨, 복구 → 배포완료. 재배포/중지 진행 중이면 서버가 no-op.
      reconcile-enabled: ${DEPLOY_RECONCILE_ENABLED:true}
      reconcile-interval-seconds: ${DEPLOY_RECONCILE_INTERVAL_SEC:300}
      public-access:
        enabled: false           # true 로 켜면 공개 서브도메인 라우팅 활성
        base-domain: micthebick.dev
        network: netis-deploy
      dockerfile-prompt-template: |
        당신은 DevOps 엔지니어입니다. 현재 디렉토리는 '{github_repo}'의 '{branch}' 브랜치 체크아웃입니다.
        이 프로젝트를 컨테이너로 실행하기 위한 production용 Dockerfile을 현재 디렉토리 루트에 생성하세요.

        지침:
        - 프로젝트 타입(빌드 도구/런타임)을 먼저 감지하세요 (예: Gradle/Maven+JDK, Node, Python 등).
        - 멀티스테이지 빌드로 최종 이미지를 작게 유지하세요.
        - 애플리케이션이 LISTEN하는 포트를 EXPOSE 지시어로 반드시 명시하세요.
        - 외부 DB/서비스 의존은 환경변수로 주입받도록 두고, 빌드 시 필수 단계만 수행하세요.
        - Dockerfile 외 다른 파일은 만들지 마세요.
        - 완료 직전에 생성한 Dockerfile 전체 내용을 출력하세요.
