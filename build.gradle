plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hamonsoft'
version = '0.1.0-SNAPSHOT'

// Spring Boot dependency management의 testcontainers BOM(1.20.4) override
ext['testcontainers.version'] = '1.21.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.fork = false
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://projectlombok.org/edge-releases' }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OAuth2 Resource Server (JWT)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // PostgreSQL JDBC + Flyway
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Lombok (edge for Java 24, same as netis-backend)
    compileOnly 'org.projectlombok:lombok:edge-SNAPSHOT'
    annotationProcessor 'org.projectlombok:lombok:edge-SNAPSHOT'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // 시스템 Java 26과 Testcontainers/docker-java 호환성 이슈 회피용 launcher 강제
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }

    forkEvery = 0
    maxParallelForks = 1

    minHeapSize = "256m"
    maxHeapSize = "1024m"
    jvmArgs = ['-XX:+UseSerialGC', '-XX:MaxMetaspaceSize=256m']

    // macOS Docker Desktop socket 경로 (Testcontainers가 자동 감지 실패하는 경우).
    // 소켓이 실제로 있을 때만 지정 — Linux/CI에서 무조건 넣으면 존재하지 않는 경로가
    // /var/run/docker.sock 자동 감지를 가로채 컨테이너 기동이 전부 실패한다.
    def macDockerSock = "${System.getProperty('user.home')}/.docker/run/docker.sock"
    if (System.getenv('DOCKER_HOST') == null && file(macDockerSock).exists()) {
        environment 'DOCKER_HOST', "unix://${macDockerSock}"
    }
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'false'

    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}
