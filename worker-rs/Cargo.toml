[package]
name = "netis-worker-rs"
version = "0.1.0"
edition = "2024"
description = "Rust pilot of the NetisMaker worker daemon (analysis tasks only)"
publish = false

[lib]
name = "netis_worker_rs"
path = "src/lib.rs"

[[bin]]
name = "netis-worker-rs"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
