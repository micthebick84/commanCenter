name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle + Testcontainers)
    # Testcontainers 2.x(docker-java 3.7.x, API 1.44 명시)로 Engine 28/29 모두 호환 —
    # 과거 24.04 핀(Engine 29 비호환)은 해제됨. 상세는 build.gradle test 블록 주석 참고.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # @EnabledIfEnvironmentVariable 게이트 해제 — 통합테스트 전체 실행
      RUN_TESTCONTAINERS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/test/
          retention-days: 7

  frontend:
    name: Frontend (vitest + vue-tsc + nuxt build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # nuxi build 는 타입체크를 하지 않는다 — 타입 오류만으로는 빌드가 통과하므로 별도 게이트.
      # .nuxt(생성물)에 의존하는데 npm ci 의 postinstall(nuxi prepare)이 만들어 준다.
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  interview-service:
    name: Interview service (vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: netismaker-interview-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: netismaker-interview-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type-check build
        run: npm run build
