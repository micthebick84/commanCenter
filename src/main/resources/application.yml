server:
  port: 8090

spring:
  application:
    name: netis-maker
  profiles:
    # 기본 프로파일. 운영 시 'api' 또는 'worker' 중 하나 활성화
    # api    → 사내 서버에서 사용자/관리자 REST API + 워커 수신 API
    # worker → 운영자 macOS에서 분석 워커 데몬
    # 둘 다 활성 가능 (단일 호스트 통합 테스트용)
    active: api

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ntflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      # 커넥션을 30s 이상 빌린 채 반환 안 하면 누수 경보 로깅(조기 탐지). SSE 누수 재발 감시용.
      leak-detection-threshold: 30000

  jpa:
    # SSE 인터뷰 스트림(text/event-stream)은 장수명 async 요청이라, OSIV(기본 true)가
    # EntityManager+DB 커넥션을 스트림 수명만큼 바인딩 → 스트림 ~10개면 Hikari 풀(max 10) 고갈,
    # 이후 모든 DB 엔드포인트가 20s 타임아웃 500. 엔티티에 lazy 연관이 없고 컨트롤러는 DTO만
    # 반환하므로 OSIV를 꺼도 LazyInitializationException 위험 없음.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: com

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0     # com 스키마에 기존 객체 있어도 V1__부터 적용
    schemas: com
    default-schema: com
    locations: classpath:db/migration

  servlet:
    multipart:
      # 앱 검증(20MB/50MB, AttachmentStorage)이 먼저 걸려 한국어 에러가 나가도록 약간 높게.
      # 이 한도 초과는 GlobalExceptionHandler의 MaxUploadSizeExceededException(413) 처리.
      max-file-size: 25MB
      max-request-size: 60MB

  mail:                      # 종료 등록자 메일 (스펙 2026-10-14 §7). MAIL_USERNAME이 비면 발송 기능 꺼짐(DISABLED)
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}   # Gmail 앱 비밀번호
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false         # 메일 서버 접속 실패가 /actuator/health를 DOWN으로 만들지 않게

app:
  request-board:
    # 사용자별 열린(접수·검토중) 요청 상한. 초과하면 등록이 429.
    max-open-per-user: 20
  usage:
    # Claude Code 사용량을 세기 시작하는 날(서울 자정부터). 이보다 앞선 기록은 세지 않는다.
    count-from: ${USAGE_COUNT_FROM:2026-10-01}
    # 단가는 USD / 100만 토큰. 선택 칸: fast-multiplier(fast 모드 배수), long-context.{threshold,…}(공식 가격에 프롬프트 길이 구간이 있는 모델만).
    # 출처: https://platform.claude.com/docs/en/about-claude/pricing (확인 2026-11-09). 공식 가격이 바뀌면 여기를 PR로 고쳐 병합한 뒤 API를 재기동한다(과거분도 새 가격으로 다시 계산된다).
    # fast-multiplier: 공식 fast 모드 단가가 기본 단가의 2배인 모델(Opus 5.5 $8/$40, Opus 5 $10/$50)만 둔다. 없는 모델의 fast 줄은 '가격 미등록'으로 센다.
    prices:
      claude-opus-5-5:
        input: 4
        output: 20
        cache-write-5m: 5
        cache-write-1h: 8
        cache-read: 0.20
        fast-multiplier: 2
      claude-opus-5:
        input: 5
        output: 25
        cache-write-5m: 6.25
        cache-write-1h: 10
        cache-read: 0.50
        fast-multiplier: 2
      claude-sonnet-5-5:
        input: 2
        output: 10
        cache-write-5m: 2.50
        cache-write-1h: 4
        cache-read: 0.20
      claude-sonnet-5:
        input: 2
        output: 10
        cache-write-5m: 2.50
        cache-write-1h: 4
        cache-read: 0.20
      claude-haiku-4-5:
        input: 1
        output: 5
        cache-write-5m: 1.25
        cache-write-1h: 2
        cache-read: 0.10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
  github:
    # 비공개 레포 브랜치 조회용 GitHub PAT (선택). 비워두면 public 레포만 동작.
    pat: ${GITHUB_PAT:}
  gitlab:
    # 사내 GitLab 1곳. base-url의 호스트와 같은 Git URL을 GitLab 레포로 판별한다. 비우면 GitLab 지원 꺼짐.
    base-url: ${GITLAB_BASE_URL:}
    # 비공개 레포 브랜치 조회용 토큰(read_repository). 워커·인터뷰 서비스도 같은 GITLAB_TOKEN을 읽는다.
    token: ${GITLAB_TOKEN:}
  worker:
    # 워커 ↔ 백엔드 공유 시크릿. 운영 환경에선 환경변수 WORKER_API_KEY로 주입
    api-key: ${WORKER_API_KEY:dev-only-change-me}
  task:
    max-retry: 3
    stale-threshold-minutes: 5
    implementation-stale-threshold-minutes: 60
    implementation-review-stale-threshold-minutes: 95   # 방식별 구현중 멈춤 판정 — 직접은 위 값 (스펙 2026-10-15 §5.4)
    implementation-sdd-stale-threshold-minutes: 260
    implementation-timeout-minutes: 45                  # 방식별 워커 claude 상한 — claim 때 작업에 기록해 보낸다
    implementation-review-timeout-minutes: 80
    implementation-sdd-timeout-minutes: 240
    deploy-stale-threshold-minutes: 70         # 워커 dockerfile 10m + 미리 빌드 20m + build 30m + 여유 — application-worker.yml deploy 상한과 같이 볼 것
    design-stale-threshold-minutes: 30         # 디자인 생성(목업 생성) 처리 시간 초과
    close-stale-threshold-minutes: 60          # 종료(병합·배포 중지·산출물 꺼내기·업로드·노트 claude 10분·정리) 처리 시간 초과 → 종료대기로 재큐잉
    close-patch-stale-threshold-minutes: 110   # 부분 패치 모드가 REQUIRED인 종료 — PATCH_BUILT 뒤에도 이 값(전·후 미리 빌드 각 DEPLOY_PREBUILD_TIMEOUT 20m + 패치 계산·업로드 + 기존 종료 단계) — application-worker.yml DEPLOY_PREBUILD_TIMEOUT 상한과 같이 볼 것
    worker-dead-threshold-seconds: 60          # 분석 단계 heartbeat 사망 판정
    implementation-worker-dead-threshold-seconds: 300   # 구현: 긴 작업 중 블립 허용
    deploy-worker-dead-threshold-seconds: 180           # 배포/중지
    design-worker-dead-threshold-seconds: 300           # 디자인: 긴 생성 중 블립 허용
    stale-check-interval-ms: 60000
    user-concurrent-limit: 5
    fix-request-max-rounds: 3                 # 작업당 승인된 수정 요청(배포 뒤 같은 브랜치 이어 구현) 상한 — 반려·철회는 안 센다, 넘으면 새 작업 등록 안내 (스펙 2026-11-03 §6.3)
  interview:
    sse-ping-interval-ms: 30000
    idle-ttl-minutes: 1440          # AWAITING_INPUT 무응답 → EXPIRED (24h)
    stale-running-minutes: 60       # RUNNING claimed_at(턴 시작) 초과 → FAILED (SDK 턴 wall-clock 백스톱)
    running-dead-seconds: 600       # RUNNING heartbeat 두절 → FAILED (워커 사망; 부팅 후 동일 시간 유예)
    queued-ttl-minutes: 60          # QUEUED 체류 초과 → EXPIRED (인터뷰 서비스 미가동 감지)
    stale-check-interval-ms: 60000  # InterviewStaleRecoveryJob 주기
    # 인터뷰·질문 체크아웃 루트. 경로 계산(InterviewWorkPaths)과 체크아웃 정리 잡이 같은 값을 쓴다 (스펙 2026-10-22 §3.3)
    work-root: ${user.home}/netis-maker/interviews
    checkout-cleanup:                     # InterviewCheckoutCleanupJob — 끝난 세션의 체크아웃(대상 session-{id} + 참조 _refs/{id})만 지운다. DB 행·첨부·플랜은 남긴다 (스펙 2026-10-22 §6)
      enabled: true
      cron: "0 50 3 * * *"                # 매일 03:50 (서버 로컬 시각). 02:30 worktree · 03:00 레포 캐시 · 03:30 첨부 · 03:40 DB MCP 토큰 정리와 겹치지 않게
      retention-days: 7                   # 마지막 활동(last_activity_at) 후 경과 시 삭제. 진행 중 세션은 나이 무관 보존. 1 미만이면 기동 실패
  question:
    max-active-per-user: 3          # 사용자당 활성(QUEUED/RUNNING/AWAITING_INPUT) 질문 세션 상한 → 초과 시 429
    max-qa-turns: 10                # 세션당 assistant 답변 상한 → ask 시 초과면 400. 불변식: < 러너 INTERVIEW_MAX_TURNS(20)
  app-log:                          # 배포된 앱 컨테이너 로그 실시간 보기 — API가 docker logs --follow를 읽어 SSE로 중계 (스펙 2026-11-03-deploy-app-log-stream)
    enabled: ${APP_LOG_ENABLED:true}      # false면 구독이 end(disabled)로 끝난다
    docker-path: ${APP_LOG_DOCKER_PATH:}  # 비우면 PATH → Windows 기본 설치 위치 순으로 docker를 찾는다(못 찾으면 기능만 꺼짐)
    tail-lines: 500                 # 접속 때 먼저 보내는 최근 줄 수 (docker logs --tail)
    max-streams: 6                  # 동시 구독 전체 상한 — 넘으면 end(too-many)
    max-streams-per-task: 3         # 작업 하나당 동시 구독 상한
    max-duration-minutes: 30        # 한 연결의 최대 시간 — 지나면 end(time-limit)로 닫고 docker·ssh 프로세스를 끝낸다
    ping-seconds: 10                # SSE 주석 핑 간격(초) — Cloudflare 유휴 끊김 방지 + 끊긴 브라우저를 다음 쓰기 실패로 빨리 알아챈다
    batch-millis: 300               # 읽은 줄을 모아 보내는 간격(ms)
    batch-lines: 200                # 이벤트 하나에 담는 줄 수 상한
    max-line-chars: 4000            # 줄 하나의 상한 — 비밀을 가린 뒤에 자르고 …(잘림)을 붙인다
  deploy-log:
    sse-ping-interval-ms: 20000     # 빌드 로그 SSE 주석 핑 간격(ms) — 조용한 빌드 구간에 Cloudflare가 연결을 끊지 않게
  db-secret:                        # 질문 세션 DB 접속정보 암호화 (스펙 2026-10-02 §4.1). 둘 다 있어야 기능이 켜진다
    key: ${NETISMAKER_DB_SECRET_KEY:}
    salt: ${NETISMAKER_DB_SECRET_SALT:}   # hex, 짝수 길이 16자 이상
  attachment:
    dir: ${user.home}/netis-maker/attachments
    max-files: 10
    max-file-size-mb: 20
    max-total-size-mb: 50
    inherit-max-total-mb: 200             # 질문 → 작업 첨부 승계 총량 상한 (스펙 2026-10-27 §7.5)
    render:                               # 첨부 pptx 슬라이드 PNG 렌더링 (스펙 2026-10-27). soffice(LibreOffice)가 없으면 꺼진다
      enabled: true
      soffice-path: ${SOFFICE_PATH:}      # 비우면 Windows 기본 설치 위치 → PATH 순으로 찾는다
      extensions: pptx,ppt
      timeout-seconds: 120                # 첨부 한 건 변환 상한 — 넘으면 soffice 프로세스 트리째 종료
      max-pages: 30
      width-px: 1600
      max-media: 20                       # 원본 그림(ppt/media) 추출 상한
      claim-wait-seconds: 180             # claim이 렌더링 완료를 기다리는 최대 시간
    cleanup:                              # AttachmentCleanupJob — 디렉터리만 지우고 DB 첨부 행은 남긴다(감사용)
      enabled: true
      cron: "0 30 3 * * *"                # 매일 03:30 (서버 로컬 시각)
      task-deleted-retention-days: 30     # soft-delete 후 경과 시 task-{id}/ 삭제. 삭제 안 된 작업은 나이 무관 보존
      question-closed-retention-days: 90  # 종료(취소·만료·실패) 후 경과 시 question-{sid}/ 삭제. 진행 중·답변 완료는 보존
      orphan-grace-hours: 24              # 소유 행 없는 디렉터리(등록 롤백 잔재)는 mtime이 이보다 오래됐을 때만 삭제 (최소 1)
  close:
    artifact:                             # 종료 산출물 보관 (스펙 2026-10-14). 켜도 카탈로그에서 켠 레포만 대상
      enabled: ${CLOSE_ARTIFACT_ENABLED:false}
      max-size-mb: ${CLOSE_ARTIFACT_MAX_SIZE_MB:1024}
    patch:                                # 종료 부분 패치 (스펙 2026-11-10). 켜도 카탈로그에서 켠 레포(미리 빌드 명령 필요)만 대상
      enabled: ${CLOSE_PATCH_ENABLED:false}
      max-size-mb: ${CLOSE_PATCH_MAX_SIZE_MB:1024}
    mail:
      from: ${MAIL_FROM:}    # 비면 MAIL_USERNAME
  db-write:                               # 구현 단계 개발 DB 쓰기 (스펙 2026-11-03 §6.1). 스위치는 기본 꺼짐 — 배포한 뒤 DB_WRITE_ENABLED=true로 켠다
    enabled: ${DB_WRITE_ENABLED:false}    # 켜도 쓰기 허용을 켠 REPO 연결 + 구현 단계 + 지원 워커 + 자동 마이그레이션 레포 아님일 때만 쓴다
    max-update-delete-rows: 1000          # 남의 테이블 UPDATE/DELETE 한 문장의 영향 행 상한 (그 작업이 만든 테이블에는 없다)
    max-insert-rows: 10000                # 남의 테이블 INSERT(INSERT…SELECT 포함) 한 문장의 영향 행 상한
  # 메일·노트 링크의 기준 주소(예: https://app-win.micthebick.dev). 비면 링크 없이 안내 문구만
  public-base-url: ${APP_PUBLIC_BASE_URL:}

logging:
  level:
    com.hamonsoft.netismaker: DEBUG
    org.springframework.security: INFO
