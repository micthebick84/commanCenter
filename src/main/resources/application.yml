server:
  port: 8090

spring:
  application:
    name: netis-maker
  profiles:
    # 기본 프로파일. 운영 시 'api' 또는 'worker' 중 하나 활성화
    # api    → 사내 서버에서 사용자/관리자 REST API + 워커 수신 API
    # worker → 운영자 macOS에서 분석 워커 데몬
    # 둘 다 활성 가능 (단일 호스트 통합 테스트용)
    active: api

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ntflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      # 커넥션을 30s 이상 빌린 채 반환 안 하면 누수 경보 로깅(조기 탐지). SSE 누수 재발 감시용.
      leak-detection-threshold: 30000

  jpa:
    # SSE 인터뷰 스트림(text/event-stream)은 장수명 async 요청이라, OSIV(기본 true)가
    # EntityManager+DB 커넥션을 스트림 수명만큼 바인딩 → 스트림 ~10개면 Hikari 풀(max 10) 고갈,
    # 이후 모든 DB 엔드포인트가 20s 타임아웃 500. 엔티티에 lazy 연관이 없고 컨트롤러는 DTO만
    # 반환하므로 OSIV를 꺼도 LazyInitializationException 위험 없음.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: com

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0     # com 스키마에 기존 객체 있어도 V1__부터 적용
    schemas: com
    default-schema: com
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
  github:
    # 비공개 레포 브랜치 조회용 GitHub PAT (선택). 비워두면 public 레포만 동작.
    pat: ${GITHUB_PAT:}
  worker:
    # 워커 ↔ 백엔드 공유 시크릿. 운영 환경에선 환경변수 WORKER_API_KEY로 주입
    api-key: ${WORKER_API_KEY:dev-only-change-me}
  task:
    max-retry: 3
    stale-threshold-minutes: 5
    implementation-stale-threshold-minutes: 60
    deploy-stale-threshold-minutes: 15
    worker-dead-threshold-seconds: 60          # 분석 단계 heartbeat 사망 판정
    implementation-worker-dead-threshold-seconds: 300   # 구현: 긴 작업 중 블립 허용
    deploy-worker-dead-threshold-seconds: 180           # 배포/중지
    stale-check-interval-ms: 60000
    user-concurrent-limit: 5
  interview:
    user-concurrent-limit: 3
    sse-ping-interval-ms: 30000
    idle-ttl-minutes: 1440          # AWAITING_INPUT 무응답 → EXPIRED (24h)
    stale-running-minutes: 60       # RUNNING claimed_at 초과 → FAILED 회수
    stale-check-interval-ms: 60000  # InterviewStaleRecoveryJob 주기

logging:
  level:
    com.hamonsoft.netismaker: DEBUG
    org.springframework.security: INFO
